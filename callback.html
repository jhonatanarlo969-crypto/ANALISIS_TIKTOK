<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorización completada</title>
</head>
<body>
  <h1>Procesando autorización...</h1>
  <p id="status">Espera un momento.</p>

  <script>
    // TikTok redirige aquí con ?code=XXXX&state=YYYY en la URL
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    const statusEl = document.getElementById('status');

    if (error) {
      statusEl.textContent = 'Error en la autorización: ' + error;
    } else if (code) {
      statusEl.innerHTML = 'Código de autorización recibido:<br><br>' +
        '<code style="word-break:break-all;background:#eee;padding:8px;display:block;">' + code + '</code>' +
        '<br>Copia este código y úsalo en tu script para pedir el access_token ' +
        '(este código expira en pocos minutos, así que hazlo rápido).';
    } else {
      statusEl.textContent = 'No se recibió ningún código en la URL.';
    }
  </script>
</body>
</html>
